name: "CI Pipeline"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ---------- JOB 1: Unit tests + coverage threshold ----------
  code-coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.check.outputs.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - name: Extract coverage percentage
        id: check
        run: |
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          print(round(float(root.attrib['line-rate']) * 100))
          ")
          echo "Coverage: $COVERAGE%"
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Enforce 80% threshold
        run: |
          COVERAGE=${{ steps.check.outputs.coverage }}
          echo "Coverage is $COVERAGE% (threshold: 80%)"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ Coverage below 80% — failing pipeline"
            exit 1
          else
            echo "✅ Coverage meets threshold — proceeding"
          fi

  # ---------- JOB 2: CodeQL security scan ----------
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ---------- JOB 3: Build image, scan it, only if BOTH gates pass ----------
  build:
    name: Build Docker Image
    needs: [code-coverage, codeql-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t user-service:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: user-service:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Confirm build succeeded
        run: docker images user-service